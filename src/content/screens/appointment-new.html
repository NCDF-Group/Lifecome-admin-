<div class="prototype">
<b>LIFECOME HEALTH · PROFESSIONAL PORTAL SCREEN</b>
<a href="/?role=doctor#appointment-new">Open interactive screen</a>
</div>
<main class="content">
<div class="pagehead">
<div>
<div class="eyebrow">WORKSPACE</div>
<h1>Arrange an appointment</h1>
<p class="sub">An illustrative scheduling request; no live availability is reserved.</p>
</div>
<div class="actions">
</div>
</div>
<section class="card">
<header class="card-head">
<h2>Appointment request</h2>
</header>
<div class="card-body">
<form data-form="appointment">
<div class="fields">
<label class="field">
<span>Service</span>
<select name="service" required>
<option >GP consultation</option>
<option >Menopause review</option>
<option >Tests and Health Checks</option>
<option >Paid Sexual Health Check</option>
<option >Professional care</option>
<option >Wellbeing session</option>
</select>
</label>
<label class="field">
<span>Location</span>
<select name="location" required>
<option >Online</option>
<option >Clinic</option>
<option >Home visit</option>
</select>
</label>
<label class="field">
<span>Date</span>
<input name="date" value="2026-11-10" type="date" required >
</label>
<label class="field">
<span>Time</span>
<input name="time" value="10:30" type="time" required >
</label>
</div>
<label class="field">
<span>Funding route</span>
<select name="funding" required>
<option >Self-pay</option>
<option >Membership check pending</option>
<option >Employer benefit check pending</option>
<option >Insurance authorisation pending</option>
</select>
</label>
<label class="check">
<input type="checkbox" name="verified" required>
<span>I have checked the fictional patient and appointment details.</span>
</label>
<div class="footer-actions">
<a class="btn ghost" href="#schedule">Back</a>
<button class="btn" type="submit">Save demo request<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
<path d="M4 12h16 m-6-6 6 6-6 6"/>
</svg>
</button>
</div>
</form>
</div>
</section>
</main>
