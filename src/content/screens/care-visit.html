<div class="prototype">
<b>LIFECOME HEALTH · PROFESSIONAL PORTAL SCREEN</b>
<a href="/?role=care#care-visit">Open interactive screen</a>
</div>
<main class="content">
<div class="pagehead">
<div>
<div class="eyebrow">WORKSPACE</div>
<h1>Care visit notes</h1>
<p class="sub">Record what happened, what was declined and what needs follow-up.</p>
</div>
<div class="actions">
</div>
</div>
<div class="patientbar">
<span class="avatar">AT</span>
<div>
<h2>Alex Taylor</h2>
<small>LC-DEMO-1001 &nbsp; · &nbsp; DOB 16 April 1984 &nbsp; · &nbsp; 42 years</small>
</div>
<div class="tags">
<span class="tag gray">Fictional patient</span>
<span class="tag amber">Penicillin — reported rash</span>
</div>
</div>
<section class="card">
<header class="card-head">
<h2>Visit record</h2>
</header>
<div class="card-body">
<form data-form="care-note">
<div class="fields">
<label class="field">
<span>Arrival time</span>
<input name="arrival" value="09:00" type="time" required >
</label>
<label class="field">
<span>Departure time</span>
<input name="departure" value="10:00" type="time" required >
</label>
</div>
<label class="field">
<span>Visit outcome</span>
<select name="outcome" required>
<option >Completed as agreed</option>
<option >Partly completed</option>
<option >Patient declined</option>
<option >Unable to gain access</option>
</select>
</label>
<label class="field">
<span>Care delivered and patient response</span>
<textarea name="delivered" required rows="3">Describe the agreed support provided and the person’s response.</textarea>
</label>
<label class="field">
<span>Observations, exceptions and concerns</span>
<textarea name="concerns" required rows="3">Record relevant observations and any changes requiring escalation.</textarea>
</label>
<label class="field">
<span>Handover / follow-up</span>
<textarea name="handover" required rows="3">Specify the next action, responsible person and due time.</textarea>
</label>
<label class="check">
<input type="checkbox" name="confirmed" required>
<span>I have accurately recorded this fictional visit and any required escalation.</span>
</label>
<div class="footer-actions">
<a class="btn ghost" href="#care-plan">Back</a>
<button class="btn" type="submit">Sign demo visit note<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
<path d="M4 12h16 m-6-6 6 6-6 6"/>
</svg>
</button>
</div>
</form>
</div>
</section>
</main>
