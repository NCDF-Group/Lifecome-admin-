<b>LIFECOME HEALTH · PROFESSIONAL PORTAL SCREEN</b>
<a href="/?role=doctor#settings">Open interactive screen</a>
</div>
<main class="content">
<div class="pagehead">
<div>
<div class="eyebrow">WORKSPACE</div>
<h1>Workspace preferences</h1>
<p class="sub">Set demonstration preferences for this browser tab.</p>
</div>
<div class="actions">
</div>
</div>
<section class="card">
<header class="card-head">
<h2>Notifications and display</h2>
</header>
<div class="card-body">
<form data-form="settings">
<label class="field">
<span>Routine notifications</span>
<select name="channel" required>
<option selected>In-app</option>
<option >Neutral email notification</option>
</select>
</label>
<label class="field">
<span>Text size</span>
<select name="text" required>
<option selected>Standard</option>
<option >Larger</option>
</select>
</label>
<label class="check">
<input type="checkbox" name="confirmed" required>
<span>I understand these preferences apply only to the demonstration.</span>
</label>
<div class="footer-actions">
<a class="btn ghost" href="#dashboard">Back</a>
<button class="btn" type="submit">Save preferences<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
<path d="M4 12h16 m-6-6 6 6-6 6"/>
</svg>
</button>
</div>
</form>
</div>
</section>
</main>
